name: Health Check
description: Verify an authenticated AutoOrg API health endpoint.

inputs:
  api-url:
    description: AutoOrg API base URL
    required: false
    default: http://localhost:3001
  timeout-seconds:
    description: Total timeout for health check
    required: false
    default: '60'
  start-local:
    description: Start a local API if needed
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Ensure API is available
      shell: bash
      env:
        AUTOORG_API_URL: ${{ inputs.api-url }}
        HEALTH_TIMEOUT: ${{ inputs.timeout-seconds }}
        START_LOCAL: ${{ inputs.start-local }}
      run: |
        set -euo pipefail
        [[ "$HEALTH_TIMEOUT" =~ ^[0-9]+$ ]] && (( HEALTH_TIMEOUT > 0 )) || { echo 'Invalid health timeout'; exit 1; }
        if bun run scripts/ci/health-check.ts > /dev/null 2>&1; then exit 0; fi
        if [[ "$START_LOCAL" == "true" && "$AUTOORG_API_URL" =~ ^http://(localhost|127\.0\.0\.1)(:[0-9]+)?/?$ ]]; then
          export API_HOST=127.0.0.1
          export AUTOORG_DB_PATH="${AUTOORG_DB_PATH:-./autoorg.db}"
          nohup bun run src/api/server.ts > api.log 2>&1 &
        fi
        for ((i=0; i<HEALTH_TIMEOUT; i++)); do
          if bun run scripts/ci/health-check.ts > /dev/null 2>&1; then exit 0; fi
          sleep 1
        done
        echo 'API health check timed out.'
        [[ ! -f api.log ]] || tail -n 20 api.log
        exit 1

    - name: Run health check script
      shell: bash
      env:
        AUTOORG_API_URL: ${{ inputs.api-url }}
      run: bun run scripts/ci/health-check.ts
