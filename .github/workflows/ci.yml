name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: Build (skipped when no build script)
        run: |
          if [ -f package.json ] && grep -q '"build"' package.json; then
            bun run build
          else
            echo "no build script; install-only check"
          fi
