name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Previously this workflow only ran `bun install` and then a step that grepped
# package.json for a "build" script (which did not exist), so it could never
# fail. typecheck, tests, migrations and the security gate all existed as npm
# scripts but were never invoked — which is how a schema/code drift that crashed
# the first cycle reached main.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  AUTOORG_DB_PATH: ${{ github.workspace }}/.ci/autoorg.db

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Migrate a fresh database
        run: |
          mkdir -p .ci
          bun run db:migrate

      - name: Migrate is idempotent
        run: |
          bun run db:migrate
          bun run db:migrate --verify

      - name: Unit tests
        run: bun run test:ci

      - name: Build
        run: bun run build

      - name: Lint
        run: bun run lint

      - name: Security scan
        run: bun run security

      - name: Dependency audit
        run: bun run audit

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-report
          path: test-results/junit.xml
          if-no-files-found: ignore

  web:
    name: Dashboard build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dashboard dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Audit dashboard dependencies
        working-directory: web
        run: bun run ../scripts/ci/dependency-audit.ts

      - name: Build dashboard
        working-directory: web
        run: bun run build
