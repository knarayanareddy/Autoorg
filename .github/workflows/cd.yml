name: CD

on:
  push:
    branches: [main]

env:
  AUTOORG_DB_PATH: /tmp/autoorg-cd-${{ github.run_id }}.db
  DB_PATH: /tmp/autoorg-cd-${{ github.run_id }}.db

jobs:
  verify-local:
    name: Verify release locally (no deployment)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-autoorg
        with:
          build-web: 'true'
      - name: Run migrations
        uses: ./.github/actions/run-migrations
      - name: Create temporary API key
        shell: bash
        run: |
          key="$(openssl rand -hex 32)"
          echo "::add-mask::$key"
          echo "AUTOORG_API_KEY=$key" >> "$GITHUB_ENV"
      - name: Authenticated local health check
        uses: ./.github/actions/health-check
        with:
          api-url: http://localhost:3001
          start-local: 'true'
      - name: Authenticated local smoke test
        run: bun run scripts/ci/smoke-test.ts
        env:
          AUTOORG_API_URL: http://localhost:3001

  deploy-staging:
    name: Staging deployment (not implemented)
    needs: verify-local
    if: ${{ vars.AUTOORG_ENABLE_STAGING_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Refuse unimplemented deployment
        run: bun run scripts/deploy/deploy-single-node.ts
