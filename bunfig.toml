[install]
frozen = false
optional = false

# NOTE: Do NOT use a literal "~" here.
#
# The previous value was `dir = "~/.bun/install/cache"`. Bun does not expand
# "~" for this setting, so it created a directory literally named `~` inside the
# repo — and 79 files of bun's package cache ended up committed to git.
#
# Omit the key entirely to use Bun's default global cache, or use an absolute
# path / $HOME.
